services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: guidein
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${GUIDEIN_POSTGRES_PASSWORD:?set GUIDEIN_POSTGRES_PASSWORD}
      GUIDEIN_MIGRATOR_PASSWORD: ${GUIDEIN_MIGRATOR_PASSWORD:?set GUIDEIN_MIGRATOR_PASSWORD}
      GUIDEIN_APP_PASSWORD: ${GUIDEIN_APP_PASSWORD:?set GUIDEIN_APP_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - guidein-postgres:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guidein"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  guidein-postgres:

